name: kit-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix tools/kit ci
      - run: npm --prefix tools/kit run check
      - run: npm --prefix tools/kit run dry-run
